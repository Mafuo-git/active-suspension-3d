<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e0e13"/>
      <stop offset="0.55" stop-color="#16161f"/>
      <stop offset="1" stop-color="#2b2758"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#grid)"/>

  <!-- logo + title -->
  <circle cx="92" cy="92" r="30" fill="#7f77dd"/>
  <circle cx="92" cy="92" r="11" fill="#ef9f27"/>
  <text x="140" y="86" font-size="20" font-weight="700" fill="#a9a3f0" letter-spacing="3">ACTIVE SUSPENSION 3D</text>
  <text x="140" y="112" font-size="16" fill="#9c9aaa">Student motorsport engineering project</text>
  <text x="62" y="200" font-size="46" font-weight="800" fill="#f5f4f0">Suspension lab + track simulator</text>
  <text x="62" y="238" font-size="20" fill="#c9c6f5">1/4-scale F2-style single-seater · live kinematics · full vehicle dynamics</text>
  <rect x="62" y="268" width="90" height="5" rx="2.5" fill="#ef9f27"/>

  <!-- tags -->
  <g font-size="15" font-weight="700">
    <rect x="62" y="296" width="96" height="32" rx="16" fill="none" stroke="#7f77dd" stroke-width="2"/>
    <text x="110" y="317" text-anchor="middle" fill="#a9a3f0">3D lab</text>
    <rect x="170" y="296" width="150" height="32" rx="16" fill="none" stroke="#8cc152" stroke-width="2"/>
    <text x="245" y="317" text-anchor="middle" fill="#a6d46a">Track simulator</text>
    <rect x="332" y="296" width="112" height="32" rx="16" fill="none" stroke="#ef9f27" stroke-width="2"/>
    <text x="388" y="317" text-anchor="middle" fill="#f3b453">Telemetry</text>
    <rect x="456" y="296" width="160" height="32" rx="16" fill="none" stroke="#e5534b" stroke-width="2"/>
    <text x="536" y="317" text-anchor="middle" fill="#f07a73">MoTeC i2 export</text>
  </g>

  <!-- front-view suspension sketch -->
  <g transform="translate(1085 205) scale(0.8)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="-215" y1="88" x2="215" y2="88" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <!-- chassis -->
    <rect x="-55" y="-10" width="110" height="54" rx="8" fill="#1f1f26" stroke="#5148b8" stroke-width="2"/>
    <!-- wheels -->
    <rect x="-200" y="-34" width="44" height="122" rx="12" fill="#121217" stroke="#ef9f27" stroke-width="2.5"/>
    <rect x="156" y="-34" width="44" height="122" rx="12" fill="#121217" stroke="#ef9f27" stroke-width="2.5"/>
    <!-- uprights -->
    <line x1="-150" y1="-8" x2="-146" y2="62" stroke="#e9e8ef" stroke-width="5"/>
    <line x1="150" y1="-8" x2="146" y2="62" stroke="#e9e8ef" stroke-width="5"/>
    <!-- wishbones -->
    <g stroke="#7f77dd" stroke-width="4">
      <line x1="-150" y1="-8" x2="-55" y2="2"/><line x1="-146" y1="62" x2="-55" y2="38"/>
      <line x1="150" y1="-8" x2="55" y2="2"/><line x1="146" y1="62" x2="55" y2="38"/>
    </g>
    <!-- pushrods + rockers + dampers -->
    <g stroke="#9c9aaa" stroke-width="3">
      <line x1="-140" y1="56" x2="-62" y2="-30"/><line x1="140" y1="56" x2="62" y2="-30"/>
    </g>
    <circle cx="-58" cy="-34" r="9" fill="#5148b8" stroke="#a9a3f0" stroke-width="2"/>
    <circle cx="58" cy="-34" r="9" fill="#5148b8" stroke="#a9a3f0" stroke-width="2"/>
    <path d="M-50 -38 L-12 -46" stroke="#4fc3a1" stroke-width="6"/>
    <path d="M50 -38 L12 -46" stroke="#4fc3a1" stroke-width="6"/>
    <!-- roll centre construction -->
    <g stroke="#ef9f27" stroke-opacity="0.75" stroke-width="1.5" stroke-dasharray="5 5">
      <line x1="-178" y1="88" x2="0" y2="74"/><line x1="178" y1="88" x2="0" y2="74"/>
    </g>
    <circle cx="0" cy="74" r="6" fill="#ef9f27"/>
    <text x="0" y="112" text-anchor="middle" font-size="13" fill="#ef9f27" stroke="none">roll centre</text>
  </g>
</svg>
